<!DOCTYPE html>
<html>

<head>
    <link href="./theme-control.css" rel="stylesheet">
</head>

<body>
    <button class="theme-control" type="button" data-theme-toggle aria-label="Change colour theme">
        <span class="theme-control__icon" data-theme-icon="system" aria-hidden="true"><i class="fa-solid fa-circle-half-stroke"></i></span>
        <span class="theme-control__icon" data-theme-icon="light" aria-hidden="true"><i class="fa-solid fa-sun"></i></span>
        <span class="theme-control__icon" data-theme-icon="dark" aria-hidden="true"><i class="fa-solid fa-moon"></i></span>
        <span class="sklair-visually-hidden" data-theme-label>Colour theme: System</span>
    </button>
</body>

</html>
