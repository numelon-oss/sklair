name: Release

on:
  push:
    tags:
      - "v[0-9]*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to package. Manual runs never publish a release"
        required: true
        default: "0.4.0"
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.metadata.outputs.version }}
      tag: ${{ steps.metadata.outputs.tag }}
      build_date: ${{ steps.metadata.outputs.build_date }}
      prerelease: ${{ steps.metadata.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v6
      - name: Resolve release metadata
        id: metadata
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" == "push" ]]; then
            version="${GITHUB_REF_NAME#v}"
          else
            version="${REQUESTED_VERSION#v}"
          fi
          if [[ ! "$version" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z]+([.-][0-9A-Za-z]+)*)?$ ]]; then
            echo "Invalid release version: $version" >&2
            exit 1
          fi
          tag="v$version"
          if [[ "$GITHUB_EVENT_NAME" == "push" && ! -s "$tag-RELEASE.md" ]]; then
            echo "Missing release notes: $tag-RELEASE.md" >&2
            exit 1
          fi
          prerelease=false
          if [[ "$version" == *-* ]]; then prerelease=true; fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "build_date=$(date -u +"%Y-%m-%dT%H:%M:%SZ")" >> "$GITHUB_OUTPUT"
          echo "prerelease=$prerelease" >> "$GITHUB_OUTPUT"

  schema:
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Generate configuration schemas
        env:
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          mkdir -p dist
          go run -mod=readonly -ldflags "-X sklair/constants.Version=$RELEASE_TAG" \
            ./tools/schema > "dist/sklair-$RELEASE_TAG.schema.json"
          cp "dist/sklair-$RELEASE_TAG.schema.json" dist/sklair.schema.json
      - uses: actions/upload-artifact@v6
        with:
          name: sklair-schema
          path: dist/*
          if-no-files-found: error

  package:
    needs: prepare
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        os: [linux, darwin, windows]
        arch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Install Debian packaging tool
        if: matrix.os == 'linux'
        run: go install github.com/goreleaser/nfpm/v2/cmd/nfpm@v2.48.0
      - name: Build and package
        env:
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
          TARGET_OS: ${{ matrix.os }}
          TARGET_ARCH: ${{ matrix.arch }}
          SKLAIR_COMMIT: ${{ github.sha }}
          SKLAIR_BUILD_DATE: ${{ needs.prepare.outputs.build_date }}
        run: bash .github/workflows/packaging/package.sh "$RELEASE_VERSION" "$TARGET_OS" "$TARGET_ARCH"
      - name: Inspect Debian package
        if: matrix.os == 'linux'
        run: |
          dpkg-deb --info dist/*.deb
          dpkg-deb --contents dist/*.deb
      - name: Install and run Linux AMD64 package
        if: matrix.os == 'linux' && matrix.arch == 'amd64'
        run: |
          sudo dpkg --install dist/*.deb
          sklair version
          sklair --help
      - uses: actions/upload-artifact@v6
        with:
          name: sklair-package-${{ matrix.os }}-${{ matrix.arch }}
          path: dist/*
          if-no-files-found: error

  assemble:
    needs: [schema, package]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v7
        with:
          pattern: sklair-*
          merge-multiple: true
          path: dist
      - name: Generate and verify checksums
        working-directory: dist
        run: |
          set -euo pipefail
          sha256sum -- *.tar.gz *.zip *.deb *.schema.json | LC_ALL=C sort -k2 > SHA256SUMS
          sha256sum --check SHA256SUMS
      - uses: actions/upload-artifact@v6
        with:
          name: release-bundle
          path: dist/*
          if-no-files-found: error

  publish:
    if: github.event_name == 'push'
    needs: [prepare, assemble]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v7
        with:
          name: release-bundle
          path: dist
      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare.outputs.tag }}
          name: Sklair ${{ needs.prepare.outputs.version }}
          prerelease: ${{ needs.prepare.outputs.prerelease == 'true' }}
          fail_on_unmatched_files: true
          files: dist/*
          body_path: ${{ needs.prepare.outputs.tag }}-RELEASE.md

  distribute:
    if: github.event_name == 'push' && needs.prepare.outputs.prerelease == 'false'
    needs: [prepare, publish]
    runs-on: ubuntu-latest
    steps:
      - name: Notify Numelon distribution repository
        env:
          GH_TOKEN: ${{ secrets.DISTRIBUTION_TOKEN }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          if [[ -z "$GH_TOKEN" ]]; then
            echo 'Set DISTRIBUTION_TOKEN in this repository to notify homebrew-distribution.' >&2
            echo 'The GitHub release is already published; distribution can be run manually once configured.' >&2
            exit 1
          fi
          jq -n --arg tag "$RELEASE_TAG" \
            '{event_type: "release-published", client_payload: {package: "sklair", tag: $tag}}' |
            gh api --method POST repos/numelon-oss/homebrew-distribution/dispatches --input -
